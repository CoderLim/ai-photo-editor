name: Prompt gallery ordering test
on:
  push:
    branches: [feat/gallery-newest-order]
    paths: ['.github/workflows/temporary-gallery-order-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx --test src/modules/prompt-gallery/service.test.ts
