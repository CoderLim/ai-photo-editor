<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="photo text editor before and after  menu board wording changed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf3ff"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <pattern id="chalk" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="60" y="48" fill="#2563eb" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="2">BEFORE</text>
  <text x="660" y="48" fill="#2563eb" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="2">AFTER</text>

  <rect x="48" y="72" width="504" height="500" rx="28" fill="#2b241c"/>
  <rect x="72" y="96" width="456" height="452" rx="18" fill="#3a3126"/>
  <rect x="72" y="96" width="456" height="452" rx="18" fill="url(#chalk)"/>
  <text x="300" y="170" text-anchor="middle" fill="#f5efe4" font-family="Georgia,serif" font-size="34" font-weight="700">TODAY'S SPECIALS</text>
  <line x1="150" y1="196" x2="450" y2="196" stroke="#d6c7a8" stroke-width="2" opacity="0.5"/>
  <text x="300" y="280" text-anchor="middle" fill="#f8f1e3" font-family="Georgia,serif" font-size="42">Soup of the Day</text>
  <text x="300" y="340" text-anchor="middle" fill="#e8dcc4" font-family="Georgia,serif" font-size="24">with crusty bread</text>
  <text x="300" y="430" text-anchor="middle" fill="#f0e6d2" font-family="Georgia,serif" font-size="28">$8.50</text>

  <rect x="648" y="72" width="504" height="500" rx="28" fill="#2b241c"/>
  <rect x="672" y="96" width="456" height="452" rx="18" fill="#3a3126"/>
  <rect x="672" y="96" width="456" height="452" rx="18" fill="url(#chalk)"/>
  <text x="900" y="170" text-anchor="middle" fill="#f5efe4" font-family="Georgia,serif" font-size="34" font-weight="700">TODAY'S SPECIALS</text>
  <line x1="750" y1="196" x2="1050" y2="196" stroke="#d6c7a8" stroke-width="2" opacity="0.5"/>
  <text x="900" y="280" text-anchor="middle" fill="#f8f1e3" font-family="Georgia,serif" font-size="42">Pumpkin Soup</text>
  <text x="900" y="340" text-anchor="middle" fill="#e8dcc4" font-family="Georgia,serif" font-size="24">with crusty bread</text>
  <text x="900" y="430" text-anchor="middle" fill="#f0e6d2" font-family="Georgia,serif" font-size="28">$8.50</text>
</svg>
