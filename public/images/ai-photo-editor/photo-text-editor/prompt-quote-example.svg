<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="describing a text replacement with the new words in quotation marks">
  <rect width="1100" height="640" rx="28" fill="#f8fbff"/>
  <rect x="40" y="40" width="1020" height="560" rx="24" fill="#ffffff" stroke="#dbe4f3" stroke-width="2"/>
  <text x="72" y="100" fill="#64748b" font-family="system-ui,sans-serif" font-size="18" font-weight="600">Describe the change</text>
  <rect x="72" y="126" width="956" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="180" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">Replace the text on the label with</text>
  <text x="100" y="220" fill="#2563eb" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">"Fresh Roast Coffee"</text>
  <text x="100" y="260" fill="#0f172a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">and keep the same font and layout.</text>
  <rect x="72" y="410" width="220" height="52" rx="12" fill="#2563eb"/>
  <text x="182" y="443" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Generate Edit</text>
  <text x="320" y="443" fill="#64748b" font-family="system-ui,sans-serif" font-size="16">Quote the new words exactly</text>
</svg>
